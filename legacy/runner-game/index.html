<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- منع التكبير على الجوال عشان السحب ما يكبّر الشاشة -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fd3ff" />
    <title>اركض يا بطل</title>
    <!-- خط عربي (لو ما فيه نت، يستخدم خط الجهاز) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- هنا تنرسم اللعبة (Three.js يضيف الـ canvas داخله) -->
    <div id="game"></div>

    <!-- العدادات أعلى الشاشة -->
    <div id="hud" hidden>
      <div class="hud-item"><span id="distance">0</span><small>م</small></div>
      <div class="hud-item"><span class="coin-icon"></span><span id="coin-count">0</span></div>
    </div>

    <!-- رسالة المستوى الجديد -->
    <div id="toast" hidden></div>

    <!-- شاشة البداية -->
    <div id="menu" class="overlay">
      <div class="card">
        <h1 class="title">اركض يا بطل</h1>
        <p class="subtitle">تفادَ العقبات واجمع العملات!</p>
        <p class="best">أعلى نتيجة: <b id="menu-best">0</b></p>
        <button id="start-btn" class="btn">ابدأ</button>
        <div class="help">
          <p class="help-keys">⬅️ ➡️ تنقل بين الحارات · ⬆️ قفز · ⬇️ انزلاق</p>
          <p class="help-touch">اسحب يمين/يسار للتنقل · فوق للقفز · تحت للانزلاق</p>
        </div>
      </div>
    </div>

    <!-- شاشة انتهت اللعبة -->
    <div id="game-over" class="overlay" hidden>
      <div class="card">
        <h2 class="title small">انتهت اللعبة</h2>
        <div id="new-record" class="record" hidden>🏆 رقم قياسي جديد!</div>
        <div class="score-label">النتيجة</div>
        <div id="final-score" class="score">0</div>
        <div class="stats">
          <div><span id="final-distance">0</span> م</div>
          <div><span class="coin-icon"></span> <span id="final-coins">0</span></div>
        </div>
        <p class="best">أعلى نتيجة: <b id="over-best">0</b></p>
        <button id="restart-btn" class="btn">العب مرة ثانية</button>
      </div>
    </div>

    <!-- عداد الإطارات (يظهر فقط لو فتحت الرابط مع ?fps) -->
    <div id="fps" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
